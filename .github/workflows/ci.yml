name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.0.0, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm 10.5.1's PowerShell wrapper can select a missing global npm CLI.
      # The Windows cmd wrapper checks that path and falls back to bundled npm.
      - run: ${{ runner.os == 'Windows' && 'npm.cmd' || 'npm' }} ci
      - name: Compare Windows shutdown instrumentation
        if: runner.os == 'Windows' && matrix.node == '22.0.0'
        run: node scripts/verify-test-hook-isolation.mjs
      - run: ${{ runner.os == 'Windows' && 'npm.cmd' || 'npm' }} test
      - name: Repeat minimum Node shutdown regression
        if: matrix.node == '22.0.0'
        run: node scripts/verify-test-shutdown.mjs
      - run: ${{ runner.os == 'Windows' && 'npm.cmd' || 'npm' }} pack --dry-run
