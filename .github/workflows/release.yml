name: Release

# 推送 vX.Y.Z 标签即发布：跑测试 → 打包 → 建 GitHub Release（附 tarball）→ 发布 npm。
# GitHub Release 用工作流内置 GITHUB_TOKEN，无需本机凭据；
# npm 发布需要仓库 secret NPM_TOKEN（缺失时跳过发布并给出警告，不阻塞 Release）。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance（--provenance 需要 OIDC）
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json version $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Pack tarball
        run: |
          npm pack --silent
          echo "TARBALL=$(ls -1 *.tgz | head -1)" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 确定性收敛：先清掉可能存在的旧/幽灵 release（如 tag 被删重建的残留，
          # gh release view 会命中它并走 edit 分支，导致列表不可见），再全新创建。
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --title "Iris $GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            "$TARBALL#dsh-iris $GITHUB_REF_NAME tarball"

      - name: Check npm credentials
        id: npmcheck
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "ready=$([ -n "$NPM_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.npmcheck.outputs.ready == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_FULL="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          # 幂等：该版本已发布过（如重跑）则跳过，避免 409 使整条流水线变红。
          if npm view "$PKG_FULL" version >/dev/null 2>&1; then
            echo "::warning::$PKG_FULL 已存在于 npm，跳过发布"
          else
            npm publish --access public --provenance
          fi

      - name: npm publish skipped
        if: steps.npmcheck.outputs.ready != 'yes'
        run: echo "::warning::未配置 NPM_TOKEN secret，GitHub Release 已创建但 npm 发布已跳过。"
