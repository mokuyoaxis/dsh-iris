name: Release

# 推送版本标签：测试/打包 → GitHub草稿与上传回执 → npm接受后公布Release → 独立只读确认。
# alpha/beta/rc 使用独立 npm 标签与 GitHub prerelease，不更新稳定版入口。
# GitHub Release 用工作流内置 GITHUB_TOKEN，无需本机凭据；
# npm 发布需要仓库 secret NPM_TOKEN；缺失时明确失败，避免将部分发行记作成功。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      manifest: ${{ steps.package.outputs.manifest }}
    permissions:
      contents: write
      id-token: write # npm provenance（--provenance 需要 OIDC）
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::未配置 NPM_TOKEN，不能完成 npm 发布"
            exit 1
          fi
      - run: npm ci
      - run: npm test

      - name: Verify tag and release channel
        run: |
          node scripts/release-metadata.mjs "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Pack tarball
        run: |
          npm pack --silent
          echo "TARBALL=$(ls -1 *.tgz | head -1)" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md

      - name: Bind the release archive
        id: package
        run: |
          RELEASE_MANIFEST="$RUNNER_TEMP/iris-release-package.json"
          MANIFEST_JSON="$(node scripts/release-publication.mjs prepare \
            --archive "$TARBALL" --tag "$GITHUB_REF_NAME" \
            --commit "$(git rev-parse HEAD)" --output "$RELEASE_MANIFEST")"
          printf 'manifest=%s\n' "$MANIFEST_JSON" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_MANIFEST=%s\n' "$RELEASE_MANIFEST" >> "$GITHUB_ENV"

      - name: Publish with an immutable upload receipt
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/release-publication.mjs publish \
            --manifest "$RELEASE_MANIFEST" --archive "$TARBALL" \
            --notes /tmp/release-notes.md --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/npm-publication.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-release-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/iris-release-package.json
            ${{ runner.temp }}/npm-publication.json
          if-no-files-found: warn

  verify-publication:
    name: Confirm npm publication (read only)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify npm publication
        env:
          RELEASE_MANIFEST_JSON: ${{ needs.release.outputs.manifest }}
        run: |
          node scripts/release-publication.mjs verify \
            --manifest-json "$RELEASE_MANIFEST_JSON" \
            --output "$RUNNER_TEMP/npm-verification.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iris-publication-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-verification.json
          if-no-files-found: warn
