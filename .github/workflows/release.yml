name: Release

# 推送 vX.Y.Z 标签即发布：跑测试 → 打包 → 建 GitHub Release（附 tarball）→ 发布 npm。
# GitHub Release 用工作流内置 GITHUB_TOKEN，无需本机凭据；
# npm 发布需要仓库 secret NPM_TOKEN；缺失时明确失败，避免将部分发行记作成功。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance（--provenance 需要 OIDC）
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::未配置 NPM_TOKEN，不能完成 npm 发布"
            exit 1
          fi
      - run: npm ci
      - run: npm test

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json version $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Pack tarball
        run: |
          npm pack --silent
          echo "TARBALL=$(ls -1 *.tgz | head -1)" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 重跑时保留已有 Release 和附件，不删除发行记录。
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > /tmp/iris-release-tags.txt
          if grep -Fxq "$GITHUB_REF_NAME" /tmp/iris-release-tags.txt; then
            echo "GitHub Release $GITHUB_REF_NAME 已存在，保留原记录"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Iris $GITHUB_REF_NAME" \
              --notes-file /tmp/release-notes.md \
              "$TARBALL#dsh-iris $GITHUB_REF_NAME tarball"
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_FULL="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          # 幂等：该版本已发布过（如重跑）则跳过，避免 409 使整条流水线变红。
          if npm view "$PKG_FULL" version >/dev/null 2>&1; then
            echo "::warning::$PKG_FULL 已存在于 npm，跳过发布"
          else
            npm publish "$TARBALL" --access public --provenance
          fi

      - name: Verify npm publication
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          # 新版可见性可能晚于 publish 成功；在线重验，最多等待五轮间隔。
          for attempt in 1 2 3 4 5 6; do
            if PUBLISHED_VERSION="$(npm view "$PKG_NAME@$PKG_VERSION" version --prefer-online --fetch-retries=0 --fetch-timeout=15000)" \
                && [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
              exit 0
            fi
            echo "::notice::npm registry 尚未确认 $PKG_VERSION（$attempt/6）"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::npm registry 未返回本次发行版本 $PKG_VERSION"
          exit 1
