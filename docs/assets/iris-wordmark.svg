<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
  <title id="title">IRIS</title>
  <desc id="desc">IRIS wordmark in a blue, violet, magenta, and coral gradient</desc>
  <defs>
    <linearGradient id="wordmark" x1="62" y1="44" x2="658" y2="158" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18B7FF"/>
      <stop offset="0.28" stop-color="#4F7CFF"/>
      <stop offset="0.54" stop-color="#8758FF"/>
      <stop offset="0.78" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#FF718F"/>
    </linearGradient>
    <linearGradient id="accent" x1="196" y1="176" x2="542" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18B7FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#4F7CFF"/>
      <stop offset="0.72" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#FF718F" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <text x="360" y="143" text-anchor="middle" fill="url(#wordmark)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="132" font-weight="800" letter-spacing="18">IRIS</text>
  <ellipse cx="369" cy="175" rx="205" ry="5" fill="url(#accent)" opacity="0.28" filter="url(#soft-glow)"/>
  <path d="M196 175 C286 183 452 183 542 175" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
</svg>
